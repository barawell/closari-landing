name: assemble-qwen-landing
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/qwen-landing-6172
    paths:
      - .github/workflows/assemble-qwen-landing.yml
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source tarball and commit landing files
        run: |
          set -euo pipefail
          PAGE="https://tmpfiles.org/wHwVqeZ5Ev8L/closari-qwen-src.tgz"
          EXPECTED="d9ac844358de3b7fa6c6bce2972798b74ade7f0dcb24eaa457cdf23bcf477896"
          HTML=$(curl -fsSL "$PAGE")
          URL=$(printf '%s' "$HTML" | grep -oE 'https://tmpfiles.org/dl/[^"[:space:]]+closari-qwen-src.tgz' | head -1)
          test -n "$URL"
          curl -fsSL -o src.tgz "$URL"
          echo "$EXPECTED  src.tgz" | sha256sum -c
          tar -xzf src.tgz
          rm -f src.tgz
          git config user.name barawell
          git config user.email barawell.id@gmail.com
          git add index.html assets
          git rm -f --ignore-unmatch parts/0.b64 parts/1.b64 parts/2.b64 parts/3.b64
          git status --short
          git diff --cached --quiet || git commit -m "Add Qwen landing HTML, runtime, and asset payloads"
          git push
